<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QCM Preparation</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f9;--card:#fff;--ink:#101a2e;--mut:#5d6b85;--line:#dfe4ee;--ok:#15803d;--okbg:#e3f6ea;--ko:#b91c1c;--kobg:#fde8e8;--wa:#a16207;--wabg:#fdf3d8;--sel:#e8effe;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--card:#16203a;--ink:#eaf0ff;--mut:#9aa8c7;--line:#26335a;--ok:#4ade80;--okbg:#10321f;--ko:#f87171;--kobg:#3a1717;--wa:#fbbf24;--wabg:#3a2f10;--sel:#1d2d57;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1424;--card:#16203a;--ink:#eaf0ff;--mut:#9aa8c7;--line:#26335a;--ok:#4ade80;--okbg:#10321f;--ko:#f87171;--kobg:#3a1717;--wa:#fbbf24;--wabg:#3a2f10;--sel:#1d2d57;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:28px;line-height:1.15;margin:4px 0 4px;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 8px}
p{margin:0 0 8px}
.mut{color:var(--mut);font-size:14px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .sp{flex:1}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:44px}
button:focus-visible,summary:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
button.pri{background:var(--c,#2563eb);border-color:transparent;color:#fff;font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.mod{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px;border-left:6px solid var(--c)}
.ico{font-size:30px;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);flex:none}
.grow{flex:1;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--c,#2563eb);border-radius:99px;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--bg);border-radius:10px;padding:8px;text-align:center;font-size:13px;color:var(--mut)}
.stat b{display:block;font-size:18px;color:var(--ink)}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.badge.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.opt{display:flex;gap:12px;width:100%;text-align:left;margin:0 0 10px;padding:12px 14px;align-items:flex-start;white-space:pre-wrap}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.multi .k{border-radius:50%}
.opt.on{background:var(--sel);border-color:var(--c)}
.opt.on .k{background:var(--c);border-color:var(--c);color:#fff}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.good .k{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.bad{background:var(--kobg);border-color:var(--ko)}.opt.bad .k{background:var(--ko);color:var(--bg);border-color:var(--ko)}
.opt{cursor:default}.quiz .opt{cursor:pointer}
.q{font-size:18px;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 16px}
.nav{display:flex;gap:10px;margin-top:14px}.nav button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:10px}
.grid button{padding:6px 0;min-height:38px;font-size:14px}
.grid .done{background:var(--sel);border-color:var(--c)}.grid .here{outline:2px solid var(--c)}
.score{text-align:center;padding:22px 16px}
.big{font-size:54px;font-weight:800;line-height:1;letter-spacing:-.03em}
.pass{color:var(--ok)}.fail{color:var(--ko)}
details.card summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.card summary::-webkit-details-marker{display:none}
.st{flex:none;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px}
.st.ko{background:var(--kobg);color:var(--ko)}.st.ok{background:var(--okbg);color:var(--ok)}.st.wa{background:var(--wabg);color:var(--wa)}
.expl{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
.modal{position:fixed;inset:0;background:rgba(5,10,25,.55);display:grid;place-items:center;padding:20px;z-index:50}
.modal .box{background:var(--card);border-radius:18px;padding:20px;max-width:380px;width:100%}
.modal .row{display:flex;gap:10px;margin-top:14px}.modal .row button{flex:1}
input[type=range]{width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 les colonnes concernées ?","o":[["a","INSERT INTO table (col1, col2) VALUES (val1, val2)"],["b","UPDATE table SET (col1, col2)"],["c","CREATE ROW table"],["d","SELECT INTO table VALUES"]],"c":["a"],"e":"Bonne réponse : A) INSERT INTO table (col1, col2) VALUES (val1, val2).","r":0},{"id":"sql_serie_4_q029","s":4,"qn":209,"t":"Quel est le rôle de la commande SAVEPOINT ?","o":[["a","Définir un point de sauvegarde intermédiaire dans une transaction"],["b","Valider définitivement une transaction"],["c","Supprimer une transaction"],["d","Créer une copie complète de la base"]],"c":["a"],"e":"Bonne réponse : A) Définir un point de sauvegarde intermédiaire dans une transaction.","r":0},{"id":"sql_serie_4_q030","s":4,"qn":210,"t":"Quelle commande permet de revenir à un point de sauvegarde dans une transaction ?","o":[["a","ROLLBACK TO SAVEPOINT"],["b","COMMIT TO SAVEPOINT"],["c","DELETE SAVEPOINT"],["d","DROP TRANSACTION"]],"c":["a"],"e":"Bonne réponse : A) ROLLBACK TO SAVEPOINT.","r":0},{"id":"sql_serie_4_q031","s":4,"qn":211,"t":"Que signifie COMMIT ?","o":[["a","Valider les modifications d'une transaction"],["b","Annuler une transaction"],["c","Supprimer une table"],["d","Créer un index"]],"c":["a"],"e":"Bonne réponse : A) Valider les modifications d'une transaction.","r":0},{"id":"sql_serie_4_q032","s":4,"qn":212,"t":"Que signifie ROLLBACK ?","o":[["a","Annuler les modifications non validées d'une transaction"],["b","Valider toutes les modifications"],["c","Créer une table"],["d","Modifier les droits des utilisateurs"]],"c":["a"],"e":"Bonne réponse : A) Annuler les modifications non validées d'une transaction.","r":0},{"id":"sql_serie_4_q033","s":4,"qn":213,"t":"Quel est le rôle de BEGIN TRANSACTION ?","o":[["a","Commencer une transaction explicite"],["b","Supprimer une transaction"],["c","Créer une base de données"],["d","Accorder des privilèges"]],"c":["a"],"e":"Bonne réponse : A) Commencer une transaction explicite.","r":0},{"id":"sql_serie_4_q034","s":4,"qn":214,"t":"Quel est le principal objectif d'une transaction SQL ?","o":[["a","Regrouper plusieurs opérations en une unité logique de travail"],["b","Créer automatiquement des sauvegardes"],["c","Remplacer les tables par des fichiers"],["d","Interdire les requêtes SELECT"]],"c":["a"],"e":"Bonne réponse : A) Regrouper plusieurs opérations en une unité logique de travail.","r":0},{"id":"sql_serie_4_q035","s":4,"qn":215,"t":"Dans les propriétés ACID, que signifie Atomicity ?","o":[["a","Toutes les opérations d'une transaction sont exécutées ou aucune ne l'est"],["b","Les données sont toujours chiffrées"],["c","Les transactions sont exécutées une seule fois par jour"],["d","Les tables sont automatiquement indexées"]],"c":["a"],"e":"Bonne réponse : A) Toutes les opérations d'une transaction sont exécutées ou aucune ne l'est.","r":0},{"id":"sql_serie_4_q036","s":4,"qn":216,"t":"Dans les propriétés ACID, que signifie Consistency ?","o":[["a","Une transaction maintient les règles d'intégrité de la base"],["b","Les données doivent être identiques dans toutes les colonnes"],["c","Les requêtes doivent être exécutées dans un ordre alphabétique"],["d","Les tables doivent avoir la même taille"]],"c":["a"],"e":"Bonne réponse : A) Une transaction maintient les règles d'intégrité de la base.","r":0},{"id":"sql_serie_4_q037","s":4,"qn":217,"t":"Dans les propriétés ACID, que signifie Isolation ?","o":[["a","Les transactions concurrentes ne doivent pas interférer de manière incorrecte"],["b","Les utilisateurs ne peuvent jamais accéder aux mêmes tables"],["c","La base doit être déconnectée du réseau"],["d","Chaque transaction doit créer sa propre base"]],"c":["a"],"e":"Bonne réponse : A) Les transactions concurrentes ne doivent pas interférer de manière incorrecte.","r":0},{"id":"sql_serie_4_q038","s":4,"qn":218,"t":"Dans les propriétés ACID, que signifie Durability ?","o":[["a","Les modifications validées restent conservées même après une panne, selon les garanties du SGBD"],["b","Les requêtes ne "id":"sql_serie_4_q048","s":4,"qn":228,"t":"Qu'est-ce qu'une lecture fantôme (phantom read) ?","o":[["a","Une nouvelle ligne apparaît ou disparaît entre deux exécutions d'une même recherche dans une transaction"],["b","Une colonne change de nom"],["c","Une clé primaire devient NULL"],["d","Une base de données disparaît du serveur"]],"c":["a"],"e":"Bonne réponse : A) Une nouvelle ligne apparaît ou disparaît entre deux exécutions d'une même recherche dans une transaction.","r":0},{"id":"sql_serie_4_q049","s":4,"qn":229,"t":"Quel est le principal objectif d'un index dans une base de données ?","o":[["a","Accélérer certaines opérations de recherche et de tri"],["b","Remplacer les données de la table"],["c","Supprimer automatiquement les doublons"],["d","Créer une sauvegarde"]],"c":["a"],"e":"Bonne réponse : A) Accélérer certaines opérations de recherche et de tri.","r":0},{"id":"sql_serie_4_q050","s":4,"qn":230,"t":"Quel est l'inconvénient potentiel d'un grand nombre d'index ?","o":[["a","Ils peuvent ralentir les opérations d'insertion, de mise à jour et de suppression"],["b","Ils empêchent toutes les requêtes SELECT"],["c","Ils suppriment les clés primaires"],["d","Ils rendent les tables invisibles"]],"c":["a"],"e":"Bonne réponse : A) Ils peuvent ralentir les opérations d'insertion, de mise à jour et de suppression.","r":0},{"id":"sql_serie_4_q051","s":4,"qn":231,"t":"Quel type d'index est généralement basé sur une structure en arbre équilibré ?","o":[["a","B-tree"],["b","Linked List uniquement"],["c","Stack"],["d","Queue"]],"c":["a"],"e":"Bonne réponse : A) B-tree.","r":0},{"id":"sql_serie_4_q052","s":4,"qn":232,"t":"Quel est le rôle d'un index composite ?","o":[["a","Indexer plusieurs colonnes dans un même index"],["b","Indexer plusieurs bases indépendantes"],["c","Remplacer toutes les clés étrangères"],["d","Créer automatiquement des vues"]],"c":["a"],"e":"Bonne réponse : A) Indexer plusieurs colonnes dans un même index.","r":0},{"id":"sql_serie_4_q053","s":4,"qn":233,"t":"Quel est le rôle principal d'un index UNIQUE ?","o":[["a","Garantir l'unicité des valeurs indexées et faciliter certaines recherches"],["b","Autoriser les doublons"],["c","Supprimer les lignes NULL"],["d","Remplacer une transaction"]],"c":["a"],"e":"Bonne réponse : A) Garantir l'unicité des valeurs indexées et faciliter certaines recherches.","r":0},{"id":"sql_serie_4_q054","s":4,"qn":234,"t":"Quelle instruction permet de consulter le plan d'exécution d'une requête dans plusieurs SGBD ?","o":[["a","EXPLAIN"],["b","DESCRIBE DATABASE ONLY"],["c","SHOW TRANSACTION"],["d","SELECT PLAN CREATE"]],"c":["a"],"e":"Bonne réponse : A) EXPLAIN.","r":0},{"id":"sql_serie_4_q055","s":4,"qn":235,"t":"Quel est l'objectif d'un plan d'exécution SQL ?","o":[["a","Montrer les opérations que le SGBD prévoit d'effectuer pour exécuter une requête"],["b","Afficher les mots de passe"],["c","Créer une sauvegarde complète"],["d","Définir les permissions des utilisateurs"]],"c":["a"],"e":"Bonne réponse : A) Montrer les opérations que le SGBD prévoit d'effectuer pour exécuter une requête.","r":0},{"id":"sql_serie_4_q056","s":4,"qn":236,"t":"Quel élément peut aider à optimiser une requête qui filtre fréquemment sur une colonne ?","o":[["a","Un index adapté à cette colonne"],["b","La suppression de la clé primaire"],["c","Le remplacement de SELECT par DELETE"],["d","L'ajout de plusieurs colonnes inutilisées"]],"c":["a"],"e":"Bonne réponse : A) Un index adapté à cette colonne.","r":0},{"id":"sql_serie_4_q057","s":4,"qn":237,"t":"Pourquoi éviter SELECT * dans certaines applications ?","o":[["a","Pour ne récupérer que les colonnes nécessaires et limiter les données transférées"],["b","Parce que SELECT * est toujours invalide"],["c","Parce qu'il supprime les colonnes"],["d","Parce qu'il crée une transaction"]],"c":["a"],"e":"Bonne réponse : A) Pour ne récupérer que les colonnes nécessaires et limiter les données transférées.","r":0},{"id":"sql_serie_4_q058","s":4,"qn":238,"t":"Qu'est-ce qu'une vue matérialisée ?","o":[["a","Une vue dont le résultat est stocké physiquement et doit être rafraîchi selon le SGBD"],["b","Une vue qui ne contient jamais de données"],["c","Une table temporaire créée uniquement par SELECT"],["d","Une vue qui supprime les données sources"]],"c":["a"],"e":"Bonne réponse : A) Une vue dont le résultat est stocké physiquement et doit être rafraîchi selon le SGBD.","r":0},{"id":"sql_serie_4_q059","s":4,"qn":239,"t":"Quelle est la différence principale entre une vue classique et une vue matérialisée ?","o":[["a","Une vue classique présente généralement une requête, tandis qu'une vue matérialisée stocke son résultat"],["b","Une vue classique est toujours plus rapide"],["c","Une vue matérialisée ne peut pas contenir de données"],["d","Une vue classique est une sauvegarde complète"]],"c":["a"],"e":"Bonne réponse : A) Une vue classique présente généralement une requête, tandis qu'une vue matérialisée stocke son résultat.","r":0},{"id":"sql_serie_4_q060","s":4,"qn":240,"t":"Quel est le rôle d'une vue dans une base de données ?","o":[["a","Présenter des données issues d'une ou plusieurs tables à travers une requête"],["b","Remplacer le moteur de base de données"],["c","Chiffrer les données automatiquement"],["d","Supprimer les relations"]],"c":["a"],"e":"Bonne réponse : A) Présenter des données issues d'une ou plusieurs tables à travers une requête.","r":0},{"id":"sql_serie_5_q001","s":5,"qn":241,"t":"Quel avantage une vue peut-elle offrir en matière de sécurité ?","o":[["a","Limiter les colonnes ou les lignes accessibles à certains utilisateurs"],["b","Donner automatiquement tous les privilèges"],["c","Désactiver les mots de passe"],["d","Empêcher toutes les jointures"]],"c":["a"],"e":"Bonne réponse : A) Limiter les colonnes ou les lignes accessibles à certains utilisateurs.","r":0},{"id":"sql_serie_5_q002","s":5,"qn":242,"t":"Quel est le rôle de ANALYZE dans plusieurs SGBD ?","o":[["a","Collecter ou mettre à jour des statistiques utiles à l seau selon des règles de sécurité.","r":0},{"id":"informatiquegenerale_serie_5_q051","s":5,"qn":291,"t":"Que signifie le principe du moindre privilège en sécurité informatique ?","o":[["a","Accorder à chaque utilisateur uniquement les droits nécessaires à ses missions"],["b","Donner les droits administrateur à tout le monde"],["c","Désactiver toutes les règles de sécurité"],["d","Interdire les connexions réseau"]],"c":["a"],"e":"Bonne réponse : A) Accorder à chaque utilisateur uniquement les droits nécessaires à ses missions.","r":0},{"id":"informatiquegenerale_serie_5_q052","s":5,"qn":292,"t":"Qu'est-ce que l'ingénierie sociale ?","o":[["a","Manipuler des personnes pour obtenir des informations ou provoquer une action"],["b","Concevoir des circuits électroniques"],["c","Créer des bases de données relationnelles"],["d","Installer des systèmes d'exploitation"]],"c":["a"],"e":"Bonne réponse : A) Manipuler des personnes pour obtenir des informations ou provoquer une action.","r":0},{"id":"informatiquegenerale_serie_5_q053","s":5,"qn":293,"t":"Qu'est-ce que le phishing ?","o":[["a","Une technique frauduleuse visant à tromper une personne pour obtenir des informations sensibles"],["b","Une méthode de compression de données"],["c","Un protocole de routage"],["d","Une technique de sauvegarde"]],"c":["a"],"e":"Bonne réponse : A) Une technique frauduleuse visant à tromper une personne pour obtenir des informations sensibles.","r":0},{"id":"informatiquegenerale_serie_5_q054","s":5,"qn":294,"t":"Quel est le rôle d'un gestionnaire de mots de passe ?","o":[["a","Stocker et organiser de manière sécurisée les identifiants"],["b","Partager automatiquement les mots de passe publiquement"],["c","Remplacer le système d'authentification"],["d","Créer des adresses IP"]],"c":["a"],"e":"Bonne réponse : A) Stocker et organiser de manière sécurisée les identifiants.","r":0},{"id":"informatiquegenerale_serie_5_q055","s":5,"qn":295,"t":"Quel est l'intérêt du chiffrement de bout en bout ?","o":[["a","Seuls les interlocuteurs autorisés disposent normalement des clés permettant de lire le contenu échangé"],["b","Tous les intermédiaires peuvent lire les messages"],["c","Il supprime le besoin d'authentification"],["d","Il empêche les utilisateurs d'envoyer des fichiers"]],"c":["a"],"e":"Bonne réponse : A) Seuls les interlocuteurs autorisés disposent normalement des clés permettant de lire le contenu échangé.","r":0},{"id":"informatiquegenerale_serie_5_q056","s":5,"qn":296,"t":"Que signifie la disponibilité dans le modèle CIA de la sécurité informatique ?","o":[["a","Les systèmes et données sont accessibles lorsque nécessaire aux utilisateurs autorisés"],["b","Les données sont toujours publiques"],["c","Les informations sont toujours modifiées"],["d","Les utilisateurs peuvent supprimer les comptes des autres"]],"c":["a"],"e":"Bonne réponse : A) Les systèmes et données sont accessibles lorsque nécessaire aux utilisateurs autorisés.","r":0},{"id":"informatiquegenerale_serie_5_q057","s":5,"qn":297,"t":"Que signifie l'intégrité dans le modèle CIA ?","o":[["a","Préserver l'exactitude et la cohérence des données contre les modifications non autorisées"],["b","Rendre les données accessibles à tous"],["c","Supprimer les informations confidentielles"],["d","Accélérer les communications réseau"]],"c":["a"],"e":"Bonne réponse : A) Préserver l'exactitude et la cohérence des données contre les modifications non autorisées.","r":0},{"id":"informatiquegenerale_serie_5_q058","s":5,"qn":298,"t":"Que signifie la confidentialité dans le modèle CIA ?","o":[["a","Empêcher l'accès aux informations par des personnes non autorisées"],["b","Garantir que les données sont toujours disponibles publiquement"],["c","Modifier les informations à chaque consultation"],["d","Supprimer automatiquement les fichiers"]],"c":["a"],"e":"Bonne réponse : A) Empêcher l'accès aux informations par des personnes non autorisées.","r":0},{"id":"informatiquegenerale_serie_5_q059","s":5,"qn":299,"t":"Pourquoi est-il important d'appliquer régulièrement les mises à jour de sécurité ?","o":[["a","Corriger les vulnérabilités connues et réduire les risques d'exploitation"],["b","Augmenter automatiquement la capacité du disque"],["c","Supprimer tous les comptes utilisateurs"],["d","Désactiver les protections du système"]],"c":["a"],"e":"Bonne réponse : A) Corriger les vulnérabilités connues et réduire les risques d'exploitation.","r":0},{"id":"informatiquegenerale_serie_5_q060","s":5,"qn":300,"t":"Quel est l'objectif principal de la transformation numérique dans une administration publique ?","o":[["a","Améliorer les services rendus aux citoyens grâce aux technologies numériques"],["b","Remplacer tous les agents administratifs par des machines"],["c","Supprimer les procédures de contrôle"],["d","Interdire les démarches à distance"]],"c":["a"],"e":"Bonne réponse : A) Améliorer les services rendus aux citoyens grâce aux technologies numériques.","r":0}]}]};
const LS="qcm_prep_v1";
let S={settings:{pass:50},attempts:[]};
try{const r=localStorage.getItem(LS);if(r){const j=JSON.parse(r);S.settings=Object.assign(S.settings,j.settings||{});S.attempts=j.attempts||[]}}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const $=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sQs=(m,s)=>D.m[m].q.filter(q=>q.s===s);
const atts=(m,s)=>S.attempts.filter(a=>a.m===m&&a.s===s);
const best=(m,s)=>atts(m,s).reduce((b,a)=>Math.max(b,a.pct),-1);
const doneCount=m=>[1,2,3,4,5].filter(s=>atts(m,s).length).length;
let V={v:"home"},Q=null,modal=null;
const setMod=m=>($.parentElement.style.setProperty("--c",D.m[m].c));
function go(v){V=v;modal=null;render();window.scrollTo(0,0)}
function fmtDate(t){return new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}

function home(){
 const tot=D.m.reduce((n,m)=>n+m.q.length,0),dn=D.m.reduce((n,m)=>n+doneCount(m.i),0);
 const mods=D.m.map(m=>{const d=doneCount(m.i);return `<button class="card mod" style="--c:${m.c}" data-a="mod" data-m="${m.i}"><span class="ico">${m.ic}</span><span class="grow"><b style="font-size:18px">${esc(m.n)}</b><div class="mut">5 séries · ${m.q.length} questions</div><div class="bar" style="--c:${m.c}"><i style="width:${d*20}%"></i></div><div class="mut" style="margin-top:4px">${d}/5 séries terminées</div></span></button>`}).join("");
 return `<div class="top"><div class="grow"><h1>QCM Preparation</h1><p class="mut">Bienvenue. Choisissez un module et entraînez-vous série par série.</p></div><button class="ghost" data-a="settings" aria-label="Réglages">⚙️</button></div>
 <div class="card"><b>Progression globale</b><div class="bar"><i style="width:${Math.round(dn/20*100)}%"></i></div><p class="mut" style="margin-top:6px">${dn}/20 séries terminées · ${tot} questions · ${S.attempts.length} tentative(s)</p></div>${mods}
 <button class="ghost" data-a="report" style="width:100%">Rapport d’import des questions</button>`}

function series(){
 const m=D.m[V.m];
 const cards=[1,2,3,4,5].map(s=>{const qs=sQs(V.m,s),A=atts(V.m,s),l=A[A.length-1],b=best(V.m,s);
 return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Série ${s}</h2><span class="badge ${A.length?"ok":""}">${A.length?"Terminée":"Non commencée"}</span></div><p class="mut">${qs.length} questions · questions ${qs[0].qn} à ${qs[qs.length-1].qn}</p>
 <div class="stats"><div class="stat"><b>${l?l.pct+"%":"—"}</b>Dernier score</div><div class="stat"><b>${b>=0?b+"%":"—"}</b>Meilleur</div><div class="stat"><b>${A.length}</b>Tentatives</div></div>
 <div style="display:flex;gap:8px"><button class="pri" style="flex:1" data-a="start" data-s="${s}">${A.length?"Refaire la série":"Commencer"}</button>${A.length?`<button data-a="hist" data-s="${s}">Historique</button>`:""}</div></div>`}).join("");
 return `<div class="top"><button data-a="home" aria-label="Retour">←</button><div class="grow"><h1 style="font-size:22px">${m.ic} ${esc(m.n)}</h1></div></div>${cards}`}

function hist(){
 const A=atts(V.m,V.s).slice().reverse();
 return `<div class="top"><button data-a="mod" data-m="${V.m}">←</button><h1 style="font-size:22px">Historique · Série ${V.s}</h1></div>`+A.map(a=>`<button class="card" style="width:100%;text-align:left" data-a="res" data-id="${a.id}"><b>${fmtDate(a.t)}</b> <span class="badge ${a.pass?"ok":""}">${a.pass?"Réussi":"Échec"}</span><div class="mut">${a.ok} / ${a.g} correctes · ${a.pct}%</div></button>`).join("")}

function startQuiz(m,s){Q={m,s,qs:sQs(m,s),i:0,ans:{},grid:false};go({v:"quiz"})}
function quiz(){
 const q=Q.qs[Q.i],m=D.m[Q.m],multi=q.c&&q.c.length>1,a=Q.ans[q.id]||[];
 const n=Q.qs.length,answered=Object.keys(Q.ans).filter(k=>Q.ans[k].length).length;
 const opts=q.o.map(([k,t])=>`<button class="opt ${multi?"multi":""} ${a.includes(k)?"on":""}" data-a="pick" data-k="${k}"><span class="k">${k.toUpperCase()}</span><span>${esc(t)}</span></button>`).join("");
 const grid=Q.grid?`<div class="grid">${Q.qs.map((x,j)=>`<button class="${(Q.ans[x.id]||[]).length?"done":""} ${j===Q.i?"here":""}" data-a="jump" data-j="${j}">${j+1}</button>`).join("")}</div>`:"";
 return `<div class="quiz"><div class="top"><button class="ghost" data-a="quit">✕</button><div class="grow"><b>Question ${Q.i+1} / ${n}</b><div class="mut">${esc(m.n)} · Série ${Q.s}</div></div><button data-a="grid">${Q.grid?"Masquer":"Grille"}</button></div>
 <div class="bar"><i style="width:${(Q.i+1)/n*100}%"></i></div>${grid}
 <div class="q">${esc(q.t)}</div>${multi?`<p class="mut">Plusieurs réponses possibles.</p>`:""}${opts}
 <div class="nav"><button data-a="prev" ${Q.i===0?"disabled":""}>Précédente</button>${Q.i<n-1?`<button class="pri" data-a="next">Suivante</button>`:`<button class="pri" data-a="finish">Terminer</button>`}</div>
 <div style="text-align:center;margin-top:14px"><button class="ghost" data-a="finish">Terminer le quiz (${answered}/${n} répondues)</button></div></div>`}

function grade(q,a){if(q.r||!q.c)return "ung";if(!a||!a.length)return "blank";return a.slice().sort().join("")===q.c.slice().sort().join("")?"ok":"ko"}
function submit(){
 let ok=0,ko=0,bl=0,un=0;const ans={};
 Q.qs.forEach(q=>{const a=Q.ans[q.id]||[];ans[q.id]=a;const g=grade(q,a);if(g==="ok")ok++;else if(g==="ko")ko++;else if(g==="blank")bl++;else un++});
 const g=ok+ko+bl,pct=g?Math.round(ok/g*100):0;
 const at={id:Date.now()+"",t:Date.now(),m:Q.m,s:Q.s,ok,ko,bl,un,g,total:Q.qs.length,pct,pass:pct>=S.settings.pass,th:S.settings.pass,ans};
 S.attempts.push(at);save();Q=null;go({v:"res",id:at.id})}
const getAt=id=>S.attempts.find(a=>a.id===id);

function results(){
 const a=getAt(V.id),m=D.m[a.m];
 return `<div class="top"><button data-a="mod" data-m="${a.m}">←</button><div class="grow"><b>${esc(m.n)} · Série ${a.s}</b><div class="mut">${fmtDate(a.t)}</div></div></div>
 <div class="card score"><div class="big ${a.pass?"pass":"fail"}">${a.ok}<span style="font-size:26px;color:var(--mut)"> / ${a.g}</span></div><p style="margin-top:8px"><b>${a.pct}%</b> · <span class="${a.pass?"pass":"fail"}"><b>${a.pass?"Réussi ✓":"Échec ✗"}</b></span></p><p class="mut">Seuil de réussite : ${a.th}% (modifiable dans les réglages)</p></div>
 <div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><b style="color:var(--ok)">${a.ok}</b>Correctes</div><div class="stat"><b style="color:var(--ko)">${a.ko}</b>Incorrectes</div><div class="stat"><b style="color:var(--wa)">${a.bl}</b>Sans réponse</div></div>
 ${a.un?`<div class="card" style="background:var(--wabg)"><b>${a.un} question(s) non notée(s)</b><p class="mut" style="margin:4px 0 0">Énoncé ambigu, incomplet ou sans réponse vérifiable : ces questions ne comptent pas dans le score.</p></div>`:""}
 <button class="pri" style="width:100%;margin-bottom:10px;--c:${m.c}" data-a="rev" data-id="${a.id}" data-f="err">Revoir les erreurs (${a.ko+a.bl})</button>
 <button style="width:100%;margin-bottom:10px" data-a="rev" data-id="${a.id}" data-f="all">Revoir toutes les questions</button>
 <button style="width:100%" data-a="start" data-s="${a.s}" data-m="${a.m}">Refaire cette série</button>`}

function review(){
 const a=getAt(V.id),m=D.m[a.m],qs=sQs(a.m,a.s);
 const lst=qs.map(q=>({q,g:grade(q,a.ans[q.id])})).filter(x=>V.f==="all"||x.g==="ko"||x.g==="blank");
 const lab={ok:["Correcte","ok"],ko:["Incorrecte","ko"],blank:["Sans réponse","wa"],ung:["Non notée","wa"]};
 const items=lst.map(({q,g})=>{const u=a.ans[q.id]||[],c=q.c||[];
  const o=q.o.map(([k,t])=>{const cls=c.includes(k)?"good":(u.includes(k)?"bad":"");return `<div class="opt ${cls}"><span class="k">${k.toUpperCase()}</span><span>${esc(t)}${u.includes(k)?` <i class="mut">(votre réponse)</i>`:""}</span></div>`}).join("");
  return `<details class="card" ${lst.length===1?"open":""}><summary><span class="st ${lab[g][1]}">${lab[g][0]}</span><span style="white-space:pre-wrap;overflow-wrap:anywhere"><b>Q${q.qn}.</b> ${esc(q.t.length>140?q.t.slice(0,140)+"…":q.t)}</span></summary>
  <div class="q" style="font-size:16px">${esc(q.t)}</div>${o}
  <p class="mut">Votre réponse : <b>${u.length?u.map(x=>x.toUpperCase()).join(", "):"aucune"}</b> · Bonne réponse : <b>${c.length?c.map(x=>x.toUpperCase()).join(", "):"à vérifier"}</b></p>
  <div class="expl">${q.r?`<b>À vérifier.</b> ${esc(q.e)}`:esc(q.e)}</div></details>`}).join("");
 return `<div class="top"><button data-a="res" data-id="${a.id}">←</button><div class="grow"><b>${V.f==="all"?"Toutes les questions":"Erreurs à revoir"}</b><div class="mut">${esc(m.n)} · Série ${a.s} · ${lst.length} question(s)</div></div></div>${items||`<div class="card score"><h2>Aucune erreur 🎉</h2><p class="mut">Toutes les questions notées sont correctes.</p></div>`}`}

function settings(){
 return `<div class="top"><button data-a="home">←</button><h1 style="font-size:22px">Réglages</h1></div>
 <div class="card"><b>Seuil de réussite : <span id="thv">${S.settings.pass}</span>%</b><input type="range" min="10" max="100" step="5" value="${S.settings.pass}" id="th" aria-label="Seuil de réussite"><p class="mut">S’applique aux prochaines tentatives.</p></div>
 <div class="card"><b>Données</b><p class="mut">Votre progression est enregistrée sur cet appareil, dans ce navigateur.</p><button data-a="reset" style="color:var(--ko)">Effacer toute la progression</button></div>`}

function report(){
 let rows="",T=[0,0,0,0,0,0],R=0;
 D.m.forEach(m=>{const c=[1,2,3,4,5].map(s=>sQs(m.i,s).length),r=m.q.filter(q=>q.r).length;R+=r;c.forEach((x,i)=>T[i]+=x);T[5]+=m.q.length;
  rows+=`<tr><td>${esc(m.n)}</td>${c.map(x=>`<td>${x}</td>`).join("")}<td><b>${m.q.length}</b></td><td>${m.q.length-r}</td><td>${r}</td></tr>`});
 const files=D.m.map(m=>`<li><b>${esc(m.f)}</b> → ${esc(m.n)}</li>`).join("");
 return `<div class="top"><button data-a="home">←</button><h1 style="font-size:22px">Rapport d’import</h1></div>
 <div class="card"><b>Fichiers détectés</b><ul style="margin:6px 0 0;padding-left:20px">${files}</ul></div>
 <div class="card tbl"><table><tr><th>Module</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>S5</th><th>Total</th><th>Vérifiées</th><th>À revoir</th></tr>${rows}<tr><td><b>Total</b></td>${T.map(x=>`<td><b>${x}</b></td>`).join("")}<td>${T[5]-R}</td><td>${R}</td></tr></table></div>
 <div class="card"><b>Écarts avec les 1 200 questions attendues</b><p class="mut" style="margin:6px 0 0">Le comptage porte sur les questions réellement détectées : ${T[5]} au total. Les séries sont découpées dans l’ordre d’origine, 60 questions par série ; la dernière série d’un module prend le reste.</p></div>
 <div class="card"><b>Questions à revoir (${R})</b><p class="mut" style="margin:6px 0 0">Elles s’affichent normalement mais ne comptent pas dans le score : énoncé incomplet ou ambigu, schéma ou image absent, choix dupliqués ou aucune réponse valide.</p></div>`}

function modalHtml(){if(!modal)return "";return `<div class="modal"><div class="box"><h2>${modal.t}</h2><p class="mut">${modal.b}</p><div class="row"><button data-a="mcancel">Annuler</button><button class="pri" data-a="mok" style="--c:${modal.danger?"#b91c1c":"#2563eb"}">${modal.ok}</button></div></div></div>`}

function render(){
 const v=V.v;let h="";
 if(V.m!==undefined)$.style.setProperty("--c",D.m[V.m].c);
 if(v==="quiz"){$.style.setProperty("--c",D.m[Q.m].c)}
 if(v==="res"||v==="rev"){const a=getAt(V.id);$.style.setProperty("--c",D.m[a.m].c)}
 h=v==="home"?home():v==="mod"?series():v==="hist"?hist():v==="quiz"?quiz():v==="res"?results():v==="rev"?review():v==="settings"?settings():report();
 $.innerHTML=h+modalHtml();
 const th=document.getElementById("th");if(th){th.oninput=e=>{document.getElementById("thv").textContent=e.target.value};th.onchange=e=>{S.settings.pass=+e.target.value;save()}}
}
$.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,d=b.dataset;
 if(a==="home")go({v:"home"});
 else if(a==="mod")go({v:"mod",m:+d.m});
 else if(a==="settings")go({v:"settings"});
 else if(a==="report")go({v:"report"});
 else if(a==="hist")go({v:"hist",m:V.m,s:+d.s});
 else if(a==="start")startQuiz(d.m!==undefined?+d.m:V.m,+d.s);
 else if(a==="pick"){const q=Q.qs[Q.i],multi=q.c&&q.c.length>1;let x=Q.ans[q.id]||[];x=multi?(x.includes(d.k)?x.filter(y=>y!==d.k):x.concat(d.k)):[d.k];Q.ans[q.id]=x;render()}
 else if(a==="next"){Q.i++;render();window.scrollTo(0,0)}
 else if(a==="prev"){Q.i--;render();window.scrollTo(0,0)}
 else if(a==="grid"){Q.grid=!Q.grid;render()}
 else if(a==="jump"){Q.i=+d.j;Q.grid=false;render();window.scrollTo(0,0)}
 else if(a==="quit"){modal={t:"Quitter le quiz ?",b:"Vos réponses ne seront pas enregistrées.",ok:"Quitter",danger:1,fn:()=>{Q=null;go({v:"mod",m:Q?Q.m:V.m})}};const m0=Q.m;modal.fn=()=>{Q=null;go({v:"mod",m:m0})};render()}
 else if(a==="finish"){const n=Q.qs.filter(q=>!(Q.ans[q.id]||[]).length).length;modal={t:"Terminer le quiz ?",b:n?`Il reste ${n} question(s) sans réponse. Elles seront comptées comme non répondues.`:"Toutes les questions ont une réponse. Envoyer vos réponses ?",ok:"Envoyer",fn:submit};render()}
 else if(a==="mcancel"){modal=null;render()}
 else if(a==="mok"){const f=modal.fn;modal=null;f()}
 else if(a==="res")go({v:"res",id:d.id});
 else if(a==="rev")go({v:"rev",id:d.id,f:d.f});
 else if(a==="reset"){modal={t:"Effacer la progression ?",b:"Tous les scores et l’historique seront supprimés.",ok:"Effacer",danger:1,fn:()=>{S.attempts=[];save();go({v:"home"})}};render()}
});
render();
</script>
</body>
</html>
